name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Validate catalog, source hashes, public fixtures and CI boundaries
        run: python3 -m unittest discover -s tests/repository -v
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  contract:
    name: SDK contract harness (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.10', '1.27.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Verify dependency locks
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Check formatting and vet
        run: |
          test -z "$(gofmt -l tests/contract)"
          go vet ./...
      - name: Run offline harness with race detector
        run: |
          mkdir -p artifacts
          go test -race -count=1 -timeout=2m -json ./... > artifacts/go-tests.json
      - name: Upload synthetic test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-go-${{ matrix.go }}
          path: artifacts/go-tests.json
          if-no-files-found: ignore
          retention-days: 7

  vulnerability:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Scan reachable dependency vulnerabilities, including test code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test ./...
